<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>רוחמה 1946 — מצגת למסך גדול</title>
<meta name="description" content="שישה ימים ברוחמה, אוגוסט 1946 — מצגת רצופה למסך גדול: תצלומי הארכיון המשוחזרים, עם הקראה.">
<meta name="robots" content="index,follow">
<link rel="canonical" href="https://ruhama1946.site/presentation.html">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#08090b; --ink:#f2efe9; --soft:#a8a49c; --accent:#c9a227; --accent2:#d9b64a;
  --serif:"Frank Ruhl Libre","Times New Roman",Georgia,serif;
  --sans:"Assistant","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--sans);overflow:hidden}
body.idle{cursor:none}
body.idle .chrome{opacity:0;pointer-events:none}

/* ---------- stage ---------- */
#stage{position:fixed;inset:0;display:grid;place-items:center;background:#000}
.frame{position:absolute;inset:0;opacity:0;transition:opacity 1.6s ease}
.frame.on{opacity:1}
.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;
  /* the prints are photographs of prints - a touch of lift reads better on a wall */
  filter:contrast(1.04) brightness(1.02)}

/* A photograph shown twice is boring; the same photograph shown whole and then
   close is two different pictures. `detail` crops in on a corner so the second
   and third showings read as new images rather than as repeats. */
.frame.detail img{object-fit:cover}

/* Four motions, cycled. Nothing ever moves the same way twice in a row. */
.frame.on img{animation-duration:14s;animation-timing-function:ease-out;
  animation-fill-mode:forwards}
.frame.on.m0 img{animation-name:km0}
.frame.on.m1 img{animation-name:km1}
.frame.on.m2 img{animation-name:km2}
.frame.on.m3 img{animation-name:km3}
@keyframes km0{from{transform:scale(1.00)}         to{transform:scale(1.09)}}
@keyframes km1{from{transform:scale(1.09)}         to{transform:scale(1.00)}}
@keyframes km2{from{transform:scale(1.06) translate(-2%,1%)} to{transform:scale(1.11) translate(2%,-1%)}}
@keyframes km3{from{transform:scale(1.10) translate(1.5%,-1.5%)} to{transform:scale(1.02) translate(-1%,1%)}}
@media (prefers-reduced-motion:reduce){.frame.on img{animation:none}}

/* vignette keeps the caption legible over a bright print */
#stage::after{content:"";position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 42%,rgba(0,0,0,.55) 100%),
             linear-gradient(to top,rgba(0,0,0,.85) 0,transparent 34%)}

/* ---------- caption ---------- */
#cap{position:fixed;inset-inline:0;bottom:0;z-index:5;padding:0 7vw 5.5vh;
  text-align:center;pointer-events:none}
#capline{font-family:var(--serif);font-size:clamp(19px,2.35vw,40px);line-height:1.42;
  max-width:24em;margin:0 auto;text-shadow:0 2px 22px rgba(0,0,0,.95);
  opacity:0;transition:opacity .9s ease .35s}
#capline.on{opacity:1}
#chapline{margin:0 0 1.1vh;font-size:clamp(11px,1.05vw,16px);letter-spacing:.18em;
  text-transform:uppercase;color:var(--accent2);opacity:.9}

/* A drawing must announce itself on a wall, where nobody reads credits. */
#sketchmark{position:fixed;z-index:7;top:3.4vh;inset-inline-start:2.4vw;
  padding:5px 14px;border:1px solid var(--accent);border-radius:999px;
  color:var(--accent);font-size:clamp(10px,.95vw,14px);letter-spacing:.16em;
  text-transform:uppercase;opacity:0;transition:opacity .6s ease;
  background:rgba(10,11,13,.55);backdrop-filter:blur(4px);pointer-events:none}
#sketchmark.on{opacity:1}

/* ---------- title / text cards ---------- */
.card{position:fixed;inset:0;z-index:6;display:none;place-content:center;
  text-align:center;padding:0 10vw;background:var(--bg)}
.card.on{display:grid;animation:fade 1.4s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.card h1{font-family:var(--serif);font-weight:600;margin:0 0 2.4vh;
  font-size:clamp(30px,5.2vw,86px);line-height:1.12}
.card .kicker{color:var(--accent2);letter-spacing:.2em;text-transform:uppercase;
  font-size:clamp(11px,1.15vw,17px);margin:0 0 2.6vh}
.card p{font-family:var(--serif);font-size:clamp(16px,1.75vw,30px);line-height:1.62;
  max-width:26em;margin:0 auto 1.4em;color:#e6e2da}
.card .fine{font-family:var(--sans);font-size:clamp(12px,1.05vw,17px);
  color:var(--soft);max-width:34em;line-height:1.6}
.rule{width:74px;height:2px;background:var(--accent);margin:3.2vh auto}

/* ---------- chrome ---------- */
.chrome{transition:opacity .45s ease}
#bar{position:fixed;inset-inline:0;top:0;z-index:9;height:3px;background:rgba(255,255,255,.1)}
#barfill{height:100%;width:0;background:var(--accent);transition:width .25s linear}
#ctl{position:fixed;z-index:9;bottom:2.2vh;inset-inline-end:2.2vw;display:flex;gap:8px}
#ctl button{background:rgba(20,20,22,.72);color:var(--ink);border:1px solid rgba(255,255,255,.18);
  border-radius:9px;padding:9px 13px;font:inherit;font-size:14px;cursor:pointer;
  backdrop-filter:blur(6px)}
#ctl button:hover{border-color:var(--accent);color:var(--accent2)}
#hint{position:fixed;z-index:9;bottom:2.6vh;inset-inline-start:2.2vw;
  color:var(--soft);font-size:13px;letter-spacing:.02em}
#count{position:fixed;z-index:9;top:2.4vh;inset-inline-end:2.2vw;
  color:var(--soft);font-size:13px;font-variant-numeric:tabular-nums}

/* ---------- start gate (browsers block autoplay with sound) ---------- */
#gate{position:fixed;inset:0;z-index:20;display:grid;place-content:center;
  text-align:center;background:var(--bg);padding:0 10vw}
#gate h1{font-family:var(--serif);font-size:clamp(28px,4.6vw,72px);margin:0 0 1.6vh;font-weight:600}
#gate p{color:var(--soft);font-size:clamp(14px,1.4vw,20px);margin:0 0 4vh;line-height:1.6}
#go{background:var(--accent);color:#141310;border:0;border-radius:12px;
  padding:16px 40px;font:inherit;font-size:clamp(15px,1.5vw,21px);font-weight:600;cursor:pointer}
#go:hover{background:var(--accent2)}
.langpick{margin-top:3.4vh;color:var(--soft);font-size:14px}
.langpick a{color:var(--accent2)}
</style>
</head>
<body>

<div id="stage" aria-hidden="true"></div>

<div id="sketchmark" aria-hidden="true"></div>
<div id="cap"><p id="chapline"></p><p id="capline"></p></div>

<!-- chapter title cards and the Alterman card are injected here -->
<div id="cards"></div>

<div id="bar" class="chrome"><div id="barfill"></div></div>
<div id="count" class="chrome"></div>
<div id="hint" class="chrome"></div>
<div id="ctl" class="chrome">
  <button id="bPrev" title="הקודם">‹</button>
  <button id="bPlay" title="השהיה">❚❚</button>
  <button id="bNext" title="הבא">›</button>
  <button id="bLang">EN</button>
  <button id="bFull">⛶</button>
</div>

<div id="gate">
  <h1 id="gTitle">שישה ימים ברוחמה</h1>
  <p id="gSub">אוגוסט 1946 · מצגת רצופה עם הקראה</p>
  <button id="go">התחלה</button>
  <p class="langpick" id="gLang"><a href="?lang=en">English</a></p>
</div>

<audio id="au" preload="none"></audio>

<script>
(function(){
'use strict';

/* Language. ?lang=en for English; Hebrew is the default, as on the rest of the site. */
var lang = new URLSearchParams(location.search).get('lang') === 'en' ? 'en' : 'he';
var RTL  = lang === 'he';

var T = {
  he:{title:'שישה ימים ברוחמה', sub:'אוגוסט 1946 · מצגת רצופה עם הקראה',
      go:'התחלה', other:'English', otherHref:'?lang=en',
      hint:'רווח — השהיה · ← → מעבר פרק · F מסך מלא', drawing:'רישום, לא תצלום',
      end:'סוף', endSub:'ruhama1946.site', of:'מתוך'},
  en:{title:'Six Days at Ruhama', sub:'August 1946 · a continuous presentation, narrated',
      go:'Begin', other:'עברית', otherHref:'?',
      hint:'Space — pause · ← → chapter · F fullscreen', drawing:'A drawing, not a photograph',
      end:'End', endSub:'ruhama1946.site', of:'of'}
}[lang];

/* ------------------------------------------------------------------ *
 * Chapters. Photo ids are the archive board numbers; captions come
 * from gallery-data.json so there is one source of truth for them.
 * The audio is the article narration, so the images are paced to the
 * words rather than to a fixed clock.
 * ------------------------------------------------------------------ */
var CH = [
  {audio:'part1', kicker:{he:'פרק א',he_:'',en:'Part One'},
   title:{he:'ארץ תחת מנדט',en:'A country under mandate'},
   ids:[{sk:'sketch_mandate_office.jpg',he:'שלטון המנדט הבריטי',en:'The British Mandate administration'},
        {sk:'sketch_checkpoint.jpg',he:'מחסום על הדרך',en:'A checkpoint on the road'},
        {sk:'sketch_immigrant_ship.jpg',he:'ספינת מעפילים מול החוף',en:'An immigrant ship off the coast'},
        {sk:'sketch_negev_map.jpg',he:'הנגב על המפה',en:'The Negev on the map'},
        {sk:'sketch_1912_founding.jpg',he:'1912 — חוות רוחמה נוסדת',en:'1912 — the Ruhama farm is founded'},
        {sk:'sketch_1913_the_well.jpg',he:'1913 — חופרים את הבאר, 38 מטרים',en:'1913 — the well, dug by hand to 38 metres'},
        '43','23','12','42']},

  {audio:'part2', kicker:{he:'פרק ב',en:'Part Two'},
   title:{he:'המשק שננטש ארבע פעמים',en:'The farm abandoned four times'},
   ids:[{sk:'sketch_moscow_society.jpg',he:'אגודת "שארית ישראל", מוסקבה',en:'The She\'erit Yisrael society, Moscow'},
        {sk:'sketch_neighbouring_village.jpg',he:'ג\'מאמה, הכפר השכן',en:'Jamama, the neighbouring village'},
        {sk:'sketch_first_building.jpg',he:'הבית הראשון',en:'The first building'},
        {sk:'sketch_water_cart.jpg',he:'עגלת המים',en:'The water cart'},
        {sk:'sketch_raising_a_hut.jpg',he:'מקימים צריף',en:'Raising a hut'},
        {sk:'sketch_1917_expulsion.jpg',he:'1917 — נטישה ראשונה',en:'1917 — the first abandonment'},
        {sk:'sketch_1936_orchards.jpg',he:'1936 — הפרדסים נעקרים',en:'1936 — the orchards uprooted'},
        {sk:'sketch_1943_return.jpg',he:'דצמבר 1943 — חוזרים לבאר',en:'December 1943 — back to the well'},
        {sk:'sketch_1944_night_landing.jpg',he:'29 במרץ 1944 — עלייה לקרקע, בלילה',en:'29 March 1944 — going up to the land, at night'},
        {sk:'sketch_palmach_training.jpg',he:'אימוני פלמ"ח בוואדיות',en:'Palmach training in the wadis'},
        '43','42','23']},

  {audio:'part3', kicker:{he:'פרק ג',en:'Part Three'},
   title:{he:'שישה ימים',en:'Six days'},
   ids:[{sk:'sketch_loudspeaker.jpg',he:'ההכרזה ברמקול',en:'The announcement over the loudspeaker'},
        {sk:'sketch_the_radio.jpg',he:'רדיו ירושלים מודיע על המבצע',en:'Radio Jerusalem announces the operation'},
        {sk:'sketch_slik.jpg',he:'סליק — מחבוא נשק מתחת לרצפה',en:'A slik — an arms cache beneath a floor'},
        {sk:'sketch_moving_the_weapons.jpg',he:'הנשק הוצא אל מחוץ לגדר לפני בוא החיילים',en:'The weapons went outside the perimeter before the troops came'},
        {sk:'sketch_the_cordon.jpg',he:'28 באוגוסט — הטבעת נסגרת',en:'28 August — the ring closes'},
        '08','11','13',
        {sk:'sketch_the_search.jpg',he:'שוברים את הרצפה',en:'Breaking the floor'},
        {sk:'sketch_assembled_in_the_yard.jpg',he:'מכונסים בחצר, תחת שמירה',en:'Assembled in the yard, under guard'},
        '14','16',
        {sk:'sketch_trenches_along_the_walls.jpg',he:'תעלות נחפרות לאורך הקירות',en:'Trenches dug along the walls'},
        '18','19',
        {sk:'sketch_dogs_in_the_room.jpg',he:'הכלבים בחדרים',en:'The dogs in the rooms'},
        '21','26',
        {sk:'sketch_the_food_stores.jpg',he:'מחסני המזון',en:'The food stores'},
        '31','33',
        {sk:'sketch_the_hay_burning.jpg',he:'החציר בוער',en:'The hay burning'},
        '35','36',
        {sk:'sketch_the_dining_hall.jpg',he:'חדר האוכל',en:'The dining hall'},
        '37','39','44']},

  {card:'alterman'},

  {audio:'part4', kicker:{he:'פרק ד',en:'Part Four'},
   title:{he:'האנשים בתצלומים',en:'The people in the photographs'},
   ids:['27','28','34','45']},

  {audio:'part5', kicker:{he:'פרק ה',en:'Part Five'},
   title:{he:'מה שלא נמצא',en:'What was not found'},
   ids:['29',{sk:'sketch_1946_tracker_dogs.jpg',he:'כלבי הגישוש שהביאו הבריטים',en:'The tracker dogs the British brought in'},'47','45','35']},

  {audio:'part6', kicker:{he:'פרק ו',en:'Part Six'},
   title:{he:'אחת עשרה נקודות',en:'Eleven points'},
   ids:['45','47',
        {sk:'sketch_rebuilding.jpg',he:'בונים מחדש',en:'Rebuilding'},
        {sk:'sketch_field_hospital.jpg',he:'בית חולים שדה',en:'A field hospital'},
        {sk:'sketch_airstrip.jpg',he:'מנחת בשדה פתוח',en:'A landing strip in open country'},
        {sk:'sketch_1946_eleven_points.jpg',he:'אוקטובר 1946 — אחת עשרה נקודות בלילה אחד',en:'October 1946 — eleven points in one night'},
        '43','23']}
];

var ALTERMAN = {
  he:{kicker:'30 באוגוסט 1946 — היום השלישי למצור',
      h:'אלתרמן עונה',
      p:['בעוד החיילים עדיין בתוך הקיבוץ, פרסם נתן אלתרמן ב"דבר" את טורו ' +
         '"מרשימותיו של כלב" — אחד מטורי <em>הטור השביעי</em>.',
         'ימים ספורים קודם לכן פרסמה העיתונות תצלומים של כלבי גישוש שהביאו ' +
         'הבריטים לארץ כדי לאתר את סליקי ההגנה. אלתרמן השיב להם מפיו של אחד הכלבים.'],
      fine:'הטקסט המלא מוגן בזכויות יוצרים עד 2040 ואינו מוצג כאן. ' +
           'חיים גורי מצטט אותו בסרטון של בית הפלמ״ח — הקישור באתר.'},
  en:{kicker:'30 August 1946 — the third day of the siege',
      h:'Alterman answers',
      p:['While the soldiers were still inside the kibbutz, Nathan Alterman ' +
         'published his column "From the Notes of a Dog" in <em>Davar</em> — ' +
         'one of his <em>Seventh Column</em> pieces.',
         'Days earlier the press had run photographs of the tracker dogs the ' +
         'British brought in to find the Haganah’s arms caches. Alterman ' +
         'answered them in the voice of one of the dogs.'],
      fine:'The text itself is in copyright until 2040 and is not shown here. ' +
           'Haim Gouri quotes it in a Beit HaPalmach film — linked on the site.'}
};

var stage = document.getElementById('stage'),
    cards = document.getElementById('cards'),
    capline = document.getElementById('capline'),
    chapline = document.getElementById('chapline'),
    sketchmark = document.getElementById('sketchmark'),
    barfill = document.getElementById('barfill'),
    count = document.getElementById('count'),
    au = document.getElementById('au');

var caps = {};          // id -> {he,en}
var ci = 0, si = -1, playing = false, cardTimer = null;
var motion = 0, frames = [];

/* ---------- boot ---------- */
document.documentElement.lang = lang;
document.documentElement.dir = RTL ? 'rtl' : 'ltr';
document.getElementById('gTitle').textContent = T.title;
document.getElementById('gSub').textContent = T.sub;
document.getElementById('go').textContent = T.go;
document.getElementById('gLang').innerHTML =
  '<a href="' + T.otherHref + '">' + T.other + '</a>';
document.getElementById('hint').textContent = T.hint;
document.getElementById('bLang').textContent = lang === 'he' ? 'EN' : 'עב';
document.title = T.title + ' — ruhama1946.site';

fetch('gallery-data.json').then(function(r){ return r.json(); }).then(function(d){
  d.forEach(function(x){ caps[x.id] = {he:x.he || '', en:x.en || ''}; });
}).catch(function(){ /* captions are a nicety; the show runs without them */ });

/* ---------- helpers ---------- */
/* A slide is either an archive board number ('27') or a drawing:
   {sk:'file.jpg', he:'caption', en:'caption'}. The two are never allowed to
   look alike - a drawing carries a standing label on screen, exactly as it
   does in the article. On a wall in a public hall nobody reads a credit line,
   so the distinction has to be visible in the frame itself. */
function isSketch(id){ return id && typeof id === 'object'; }

function src(id){
  return isSketch(id) ? 'images/sketches/' + id.sk
                      : 'images/ai/ruhama_1946_' + id + '_ai.jpg';
}

function preload(slide){ if(slide){ var i = new Image(); i.src = src(slide.id); } }

/* Fill a chapter with enough frames that nothing sits on screen for long.
   Pass one shows every image whole, pass two crops into them, and so on, so
   the chapter reads as overview-then-detail rather than as a loop. Sketches
   are shown once per pass but never cropped. */
var TARGET = 6;                      // seconds per frame, roughly
function buildFrames(ch, seconds){
  var want = Math.max(ch.ids.length, Math.round((seconds || 90) / TARGET));
  var out = [], v = 0;
  while (out.length < want && v < 6) {
    for (var i = 0; i < ch.ids.length && out.length < want; i++) {
      var id = ch.ids[i];
      if (v > 0 && isSketch(id)) continue;   // never crop a drawing
      out.push({ id: id, v: v });
    }
    v++;
  }
  return out;
}

/* Each slide is {id, v}. v=0 shows the whole image; v>0 crops into a corner,
   so one photograph yields several genuinely different frames. Sketches are
   only ever shown whole - cropping a drawing just looks like a mistake. */
var FOCUS = ['50% 50%', '22% 26%', '78% 30%', '50% 78%'];

function show(slide){
  var id = slide.id, v = slide.v || 0;
  var old = stage.querySelector('.frame.on');
  var f = document.createElement('div');
  f.className = 'frame' + (v ? ' detail' : '');
  var img = document.createElement('img');
  img.src = src(id);
  img.alt = '';
  if (v) img.style.objectPosition = FOCUS[v % FOCUS.length];
  f.appendChild(img);
  stage.appendChild(f);
  // force a reflow so the opacity transition actually runs
  void f.offsetWidth;
  f.classList.add('on', 'm' + (motion++ % 4));
  if(old){
    old.classList.remove('on');
    setTimeout(function(){ if(old.parentNode) old.parentNode.removeChild(old); }, 1800);
  }
  var text = isSketch(id) ? (id[lang] || '') : ((caps[id] || {})[lang] || '');
  capline.classList.remove('on');
  sketchmark.textContent = T.drawing;
  sketchmark.classList.toggle('on', !!isSketch(id));
  setTimeout(function(){
    capline.textContent = text;
    capline.classList.add('on');
  }, 400);
}

function chapterTitleCard(ch, done){
  var el = document.createElement('div');
  el.className = 'card on';
  el.innerHTML = '<p class="kicker">' + (ch.kicker[lang] || '') + '</p>' +
                 '<h1>' + (ch.title[lang] || '') + '</h1>' +
                 '<div class="rule"></div>';
  cards.appendChild(el);
  cardTimer = setTimeout(function(){
    el.style.transition = 'opacity 1s'; el.style.opacity = 0;
    setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); done(); }, 1000);
  }, 3600);
}

function altermanCard(done){
  var a = ALTERMAN[lang];
  var el = document.createElement('div');
  el.className = 'card on';
  el.innerHTML = '<p class="kicker">' + a.kicker + '</p><h1>' + a.h + '</h1>' +
                 '<div class="rule"></div>' +
                 a.p.map(function(x){ return '<p>' + x + '</p>'; }).join('') +
                 '<p class="fine">' + a.fine + '</p>';
  cards.appendChild(el);
  cardTimer = setTimeout(function(){
    el.style.transition = 'opacity 1.2s'; el.style.opacity = 0;
    setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); done(); }, 1200);
  }, 22000);
}

/* ---------- chapter machine ---------- */
function startChapter(n){
  clearTimeout(cardTimer);
  ci = ((n % CH.length) + CH.length) % CH.length;
  si = -1;
  var ch = CH[ci];

  if(ch.card === 'alterman'){
    au.pause(); au.removeAttribute('src');
    chapline.textContent = ''; capline.classList.remove('on');
    altermanCard(function(){ startChapter(ci + 1); });
    return;
  }

  chapline.textContent = (ch.kicker[lang] || '');
  chapterTitleCard(ch, function(){
    frames = buildFrames(ch, 0);          // provisional until metadata lands
    au.src = 'audio/' + lang + '_' + ch.audio + '.mp3';
    au.play().catch(function(){ /* gate handles the first gesture */ });
    playing = true; sync();
    advance(0);
  });
}

function advance(i){
  if(!frames.length || i >= frames.length) return;
  si = i;
  show(frames[i]);
  preload(frames[i + 1]);
  count.textContent = (ci + 1) + ' / ' + CH.length + '  ·  ' +
                      (i + 1) + ' ' + T.of + ' ' + frames.length;
}

/* Pace the images to the narration rather than to a fixed clock: whatever the
   chapter's length turns out to be, the photographs divide it evenly. */
au.addEventListener('loadedmetadata', function(){
  var ch = CH[ci];
  if(ch && ch.ids && isFinite(au.duration)){
    frames = buildFrames(ch, au.duration);
    advance(0);
  }
});

au.addEventListener('timeupdate', function(){
  if(!frames.length || !au.duration || !isFinite(au.duration)) return;
  barfill.style.width = (au.currentTime / au.duration * 100) + '%';
  var want = Math.min(frames.length - 1,
                      Math.floor(au.currentTime / (au.duration / frames.length)));
  if(want !== si) advance(want);
});

au.addEventListener('ended', function(){ startChapter(ci + 1); });

/* An audio file that 404s must not stall the wall display. */
au.addEventListener('error', function(){
  if(au.getAttribute('src')) setTimeout(function(){ startChapter(ci + 1); }, 1200);
});

/* ---------- controls ---------- */
function sync(){ document.getElementById('bPlay').textContent = playing ? '❚❚' : '▶'; }

function toggle(){
  if(!au.src) return;
  if(au.paused){ au.play(); playing = true; } else { au.pause(); playing = false; }
  sync();
}

document.getElementById('bPlay').onclick = toggle;
document.getElementById('bNext').onclick = function(){ startChapter(ci + 1); };
document.getElementById('bPrev').onclick = function(){ startChapter(ci - 1); };
document.getElementById('bLang').onclick = function(){
  location.search = lang === 'he' ? '?lang=en' : '';
};
document.getElementById('bFull').onclick = function(){
  if(document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(function(){});
};

document.addEventListener('keydown', function(e){
  if(e.key === ' '){ e.preventDefault(); toggle(); }
  else if(e.key === 'ArrowRight') startChapter(RTL ? ci - 1 : ci + 1);
  else if(e.key === 'ArrowLeft')  startChapter(RTL ? ci + 1 : ci - 1);
  else if(e.key === 'f' || e.key === 'F') document.getElementById('bFull').click();
  else if(e.key === 'Escape' && document.fullscreenElement) document.exitFullscreen();
});

/* Hide the cursor and the controls when nobody has touched it - this thing is
   meant to be left running on a screen in a hall. */
var idle;
function wake(){
  document.body.classList.remove('idle');
  clearTimeout(idle);
  idle = setTimeout(function(){ document.body.classList.add('idle'); }, 3500);
}
['mousemove','mousedown','keydown','touchstart'].forEach(function(ev){
  document.addEventListener(ev, wake, {passive:true});
});
wake();

/* ---------- start ---------- */
document.getElementById('go').onclick = function(){
  document.getElementById('gate').style.display = 'none';
  document.documentElement.requestFullscreen().catch(function(){});
  startChapter(0);
};
})();
</script>
